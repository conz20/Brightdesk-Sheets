name: Build Brightdesk Sheets desktop installers
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      build_installers:
        description: Build the Windows, macOS and Linux desktop installers
        type: boolean
        required: true
        default: true
      publish_release:
        description: Publish a GitHub Release after all product installers pass verification
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag
        type: string
        required: true
        default: v0.1.0
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: Test Brightdesk Sheets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm run lock:verify
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:licenses
      - run: npm test
      - run: npm run release:preflight
      - run: npm audit --audit-level=high
  build:
    name: Build ${{ matrix.platform }} desktop installer
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers == true
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: windows-latest
          - platform: mac
            runner: macos-latest
          - platform: linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:product:${{ matrix.platform }}
      - run: npm run verify:product:${{ matrix.platform }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Brightdesk-Sheets-${{ matrix.platform }}
          path: release/apps/sheets/**
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish approved Brightdesk Sheets release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && inputs.build_installers == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Brightdesk-Sheets-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Brightdesk Sheets ${{ inputs.release_tag }}
          generate_release_notes: true
          files: release/**
