name: Build Brightdesk Sheets desktop installers
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read

jobs:
  test:
    name: Test Brightdesk Sheets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm run lock:verify
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:licenses
      - run: npm test
      - run: npm run release:preflight
      - run: npm audit --audit-level=high

  build:
    name: Build ${{ matrix.platform }} desktop installer
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: ["self-hosted", "Windows", "X64"]
          - platform: mac
            runner: ["self-hosted", "macOS", "ARM64"]
          - platform: linux
            runner: ["self-hosted", "Linux", "X64"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:product:${{ matrix.platform }}
      - run: npm run verify:product:${{ matrix.platform }}

  prepare-release:
    name: Prepare unpublished Brightdesk Sheets release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
      - name: Require the exact package version tag
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Refusing release: expected $EXPECTED_TAG, received $GITHUB_REF_NAME."
            exit 1
          fi
      - name: Create the unpublished release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Brightdesk Sheets ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true

  release-assets:
    name: Build and attach ${{ matrix.platform }} release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: ["self-hosted", "Windows", "X64"]
          - platform: mac
            runner: ["self-hosted", "macOS", "ARM64"]
          - platform: linux
            runner: ["self-hosted", "Linux", "X64"]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:product:${{ matrix.platform }}
      - run: npm run verify:product:${{ matrix.platform }}
      - name: Attach verified installer files to the unpublished release
        uses: __RELEASE_ACTION__
        with:
          tag_name: ${{ github.ref_name }}
          name: Brightdesk Sheets ${{ github.ref_name }}
          draft: true
          files: |
            release/apps/sheets/**
          fail_on_unmatched_files: true
          overwrite_files: true

  publish-release:
    name: Publish verified Brightdesk Sheets release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release-assets
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: write
    steps:
      - name: Publish after all three platform builds and uploads pass
        uses: __RELEASE_ACTION__
        with:
          tag_name: ${{ github.ref_name }}
          name: Brightdesk Sheets ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
