name: Build Brightdesk Sheets desktop installers
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
  actions: read
jobs:
  test:
    name: Test Brightdesk Sheets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm run lock:verify
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:licenses
      - run: npm test
      - run: npm run release:preflight
      - run: npm audit --audit-level=high
  build:
    name: Build ${{ matrix.platform }} desktop installer
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            runner: ["self-hosted", "Windows", "X64"]
          - platform: mac
            runner: ["self-hosted", "macOS", "ARM64"]
          - platform: linux
            runner: ["self-hosted", "Linux", "X64"]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run dist:product:${{ matrix.platform }}
      - run: npm run verify:product:${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Brightdesk-Sheets-${{ matrix.platform }}
          path: release/apps/sheets/**
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish approved Brightdesk Sheets release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: [self-hosted, macOS, ARM64, brightdesk-product-ci]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Brightdesk-Sheets-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Brightdesk Sheets ${{ github.ref_name }}
          generate_release_notes: true
          files: release/**
