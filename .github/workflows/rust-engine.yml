name: Brightdesk Rust Node-API engine
on:
  push:
    branches: [main, "feature/**"]
    paths: ["rust/**", "native/**", "scripts/build-native.js", "src/main.js", "src/preload.js", "src/rust-engine.js", "src/rust-engine-fallback.js", "electron-builder.app.config.js", "package.json", "tests/rust-engine.test.js", ".github/workflows/rust-engine.yml"]
  pull_request:
    paths: ["rust/**", "native/**", "scripts/build-native.js", "src/main.js", "src/preload.js", "src/rust-engine.js", "src/rust-engine-fallback.js", "electron-builder.app.config.js", "package.json", "tests/rust-engine.test.js", ".github/workflows/rust-engine.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brightdesk-rust-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.22.2"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --workspace --locked
      - run: npm run native:build
      - name: Verify the native Node-API module
        env:
          BRIGHTDESK_REQUIRE_NATIVE_ENGINE: "1"
        run: node --test tests/rust-engine.test.js
