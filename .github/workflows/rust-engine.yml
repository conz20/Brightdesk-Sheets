name: Brightdesk Rust engine
on:
  push:
    branches: [main, "feature/**"]
    paths: ["rust/**","scripts/rust-engine.mjs","tests/rust-engine.test.mjs",".github/workflows/rust-engine.yml"]
  pull_request:
    paths: ["rust/**","scripts/rust-engine.mjs","tests/rust-engine.test.mjs",".github/workflows/rust-engine.yml"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: rust-engine-${{ github.ref }}, cancel-in-progress: true }
jobs:
  rust-engine:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-latest, windows-latest, macos-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - uses: actions/setup-node@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { node-version: "24.22.2" }
      - run: cargo fmt --manifest-path rust/Cargo.toml --all
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo build --manifest-path rust/Cargo.toml --release
      - run: node --test tests/rust-engine.test.mjs
